<html>
    <head>
        <title>MERCURY: Registro</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/registros.css">
    </head>
    <body>
        <div>
            <h1>EDUSAN</h1>
            <h2>Registro</h2>
            <form action="registrojsp.jsp" method="post" name="cuestionario">
                Usuario: <br>
                <input type="text" id="usuario" name="usuario" value="" class="texto"><br>
                Contraseña: <br>
                <input type="text" id="contrasena" name="contrasena" value="" class="texto"><br>
                Nombre:<br>
                <input type="text" id="nombre" name="nombre" value="" class="texto"><br>
                Apellido:<br>
                <input type="text" id="apellido" name="apellido" value="" class="texto"><br>
                Teléfono:<br>
                <input type="text" id="telefono" name="telefono" value="" class="texto"><br>
                Número (Casa/Departamento): <br>
                <input type="text" id="numeroCD" name="numeroCD" value="" class="texto"><br>
                Calle: <br>
                <input type="text" id="calle" name="calle" value="" class="texto"><br>
                Colonia: <br>
                <input type="text" id="colonia" name="colonia" value="" class="texto"><br>
                <input type="submit" id="enviar" value="Registrarme" name="enviar" class="enviar">
            </form>
            <a href="indexJSP.jsp">Regresar</a>
        </div>
    </body>
</html>
