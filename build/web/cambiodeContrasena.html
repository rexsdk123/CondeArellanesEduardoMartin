<html>
    <head>
        <title>ARRAYLABS: Cambio de contraseña</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/cambioContrasena.css">
    </head>
    <body>
        <div class="principal">
            <div class="Contenido">

                <h1>Restablecer contraseña</h1>
                <form action="cambioContrasena.jsp" name="cambioContra" method="post">
                    <div class="NombUsuario">
                        Nombre de usuario: <input type="text" id="username" name="username"><br>
                    </div>

                    <div class="apellido">
                        Apellido: <input type="text" id="apellido" name="apellido"><br>
                    </div>

                    <div class="telef">
                        Número de teléfono: <input type="text" id="telefono" name="telefono"> <br>
                    </div>
                    <div class="NuevaPass">
                        Contraseña nueva: <input type="contrasena" id="username" name="contra"><br>
                    </div>

                    <div class="confiPass">
                        Confirma la contraseña nueva: <input type="contrasena" id="phone" name="contraver"><br>
                    </div>
                    <br><br>
                    <div class="botones">
                        <button class="btn">Enviar</button>
                        <a href="index.html" class="volver">Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
