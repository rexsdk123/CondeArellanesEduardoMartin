<html>
    <head>
        <title>MERCURY: Inflable Mario Bros</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="img/inflable.png" type="image/x-icon">
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const posicion = document.querySelector('.imagenesSeguimiento');
                const deslizar = Array.from(posicion.children);
                const botonSiguiente = document.querySelector('.imagenesbotonSig');
                const botonAnterior = document.querySelector('.imagenesbotonAnt');
                let IndexActual = 0;

                function ActualizarImagen() {
                    const deslizadorAncho = deslizar[0].getBoundingClientRect().width;
                    posicion.style.transform = 'translateX(-' + (deslizadorAncho * IndexActual) + 'px)';
                }

                botonSiguiente.addEventListener('click', () => {
                    IndexActual = (IndexActual + 1) % deslizar.length;
                    ActualizarImagen();
                });

                botonAnterior.addEventListener('click', () => {
                    IndexActual = (IndexActual - 1 + deslizar.length) % deslizar.length;
                    ActualizarImagen();
                });

            });
        </script>
    </head>
    <body>
        <section class="PP">
            <div class="imgPP">
                <div class="carousel">
                    <button class="imagenesbotonAnt">&#10094;</button>
                    <div class="imagenesSeguimiento">
                        <div class="deslizador"><img src="img/marioBros5.jpeg" alt="Inflable Mario Bros 1"></div>
                        <div class="deslizador"><img src="img/marioBros.jpeg"  alt="Inflable Mario Bros 2"></div>
                        <div class="deslizador"><img src="img/marioBros2.jpeg" alt="Inflable Mario Bros 3"></div>
                        <div class="deslizador"><img src="img/marioBros3.jpeg" alt="Inflable Mario Bros 4"></div>
                        <div class="deslizador"><img src="img/marioBros4.jpeg" alt="Inflable Mario Bros 5"></div>
                    </div>
                    <button class="imagenesbotonSig">&#10095;</button>
                </div>
            </div>

            <div class="infosPP">
                <div class="TextoPP">
                    <div class="TituloPP">
                        <h2>Inflable mario bros</h2>
                    </div>
                    <div class="ValorPP">
                        $600 MXN
                    </div>
                    <hr>
                    <div class="ImpuestosPP">
                        Envio gratuito <br><br>
                        (IMPORTATE: UNICAMENTE A LOS ALREDEDORES DE IZTAPALAPA)
                    </div>
                    <hr>
                    <div class="InfoPP">
                        Dimensiones:<br>
                        1.5 Ancho (metros)
                        <br>
                        3 Largo (metros)
                        <br>
                        2 Altura (metros)
                    </div>
                    <div class="botonPP">
                        <a href="../Inflables.html"><b>Volver</b></a>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
