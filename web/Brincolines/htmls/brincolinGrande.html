<html>
    <head>
        <title>MERCURY: Brincolin Grande</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="shortcut icon" href="img/inflable.png" type="image/x-icon">
        <script>
            //Profesor, Enrique. el siguiente codigo lo revisamos en un canal de youtube, y decidimos agregarlo a la pagina web
            // Esta comentado todo el proceso para validar que se reviso correctamente
            
            //Esperamos hasta que el HTML esté listo para empezar
            document.addEventListener('DOMContentLoaded', () => {

                //Seleccionamos el contenedor de las diapositivas (las imágenes que se van a mover)
                const posicion = document.querySelector('.imagenesSeguimiento');

                // Obtenemos todos las imagenes dentro de la posicion y los convertimos en un array
                const deslizar = Array.from(posicion.children);

                // Seleccionamos los botones de siguiente y anterior
                const botonSiguiente = document.querySelector('.imagenesbotonSig');
                const botonAnterior = document.querySelector('.imagenesbotonAnt');

                // Esta variable nos dira que imagen estamos viendo
                let IndexActual = 0;

                // Esta función mueve la posicion para mostrar la imagen correspondiente
                function ActualizarImagen() {
                    // Obtenemos el ancho de una imagen (todas tiene el mismo ancho)
                    const deslizadorAncho = deslizar[0].getBoundingClientRect().width;

                    // Movemos la posicion hacia la izquierda multiplicando el índice actual por el ancho de cada slide
                    posicion.style.transform = 'translateX(-' + (deslizadorAncho * IndexActual) + 'px)';
                }

                // Si le picas al boton siguiente, aumentamos el índice y se actualizan los botones
                botonSiguiente.addEventListener('click', () => {
                    // Vamos al siguiente slide
                    // Si estamos en el último volvemos al primero
                    IndexActual = (IndexActual + 1) % deslizar.length;
                    ActualizarImagen();
                });

                // Si le picas al botón anterior, retrocedemos una imagen y actualizamos
                botonAnterior.addEventListener('click', () => {
                    // Si estamos en el primero, regresamos al último (por eso sumamos deslizar.length antes de aplicar el %)
                    IndexActual = (IndexActual - 1 + deslizar.length) % deslizar.length;
                    ActualizarImagen();
                });

            });
        </script>
    </head>
    <body>
        <section class="PP">
            <div class="imgPP">
                <div class="carousel">
                    <button class="imagenesbotonAnt">&#10094;</button>
                    <div class="imagenesSeguimiento">
                        <div class="deslizador"><img src="img/brincolinNegro.jpeg" alt="Brincolin Grande 1"></div>
                        <div class="deslizador"><img src="img/brincolinNegro2.jpeg" alt="Brincolin Grande 2"></div>
                    </div>
                    <button class="imagenesbotonSig">&#10095;</button>
                </div>
            </div>
            <div class="infosPP">
                <div class="TextoPP">
                    <div class="TituloPP">
                        <h2>Brincolin grande</h2>
                    </div>
                    <div class="ValorPP">
                        $600 MXN
                    </div>
                    <hr>
                    <div class="ImpuestosPP">
                        Envio gratuito <br><br>
                        (IMPORTATE: UNICAMENTE A LOS ALREDEDORES DE IZTAPALAPA)
                    </div>
                    <hr>
                    <div class="InfoPP">
                        Dimensiones:<br>
                        3.5 Ancho (metros)
                        <br>
                        3.5 Largo (metros)
                        <br>
                        2.8 Altura (metros)
                    </div>
                    <div class="botonPP">
                        <a href="../Brincolines.html"><b>Volver</b></a>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
