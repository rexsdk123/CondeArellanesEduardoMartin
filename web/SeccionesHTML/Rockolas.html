<html>
    <head>
        <title>MERCURY: ROCKOLA</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="img/inflable.png" type="image/x-icon">
        <style>
            header{
                background-color: white;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;


                top: 0;

                height: 5vh;
                width: 100%;
            }
            /* Izquierda,  donde va el nombre de la marca */
            .MARCA{
                height: 100%;
                width: 10%;
            }
            .MARCA p{
                margin-top: 5px;
                margin-left: 10px;
                font-size: 30px;
                font-family: Arial;
            }
            .MARCA p a{
                text-decoration: none;
                color: black;
            }
            /* Medio, donde van los links a cada pagina de compra */
            .LINKS{
                height: 100%;
                width: 60%;
                font-size: 20px;

                display: flex;
                align-items: center;
            }
            .LINKS a{
                text-decoration: none;
                color: black;
                font-family: Arial;

            }
            .LINKS .a1{
                margin-left: 50px;
            }
            .LINKS .a2, .a3, .a4{
                margin-left: 25px;
            }
            /* Derecha, donde va el inisio de sesion y el carrito */
            .SESION{
                height: 100%;
                width: 30%;

                display: flex;
                margin-right: 10px;
                align-content: right;
            }
            .SESION a{
                text-decoration: none;
                color: black;
                font-family: Arial;
                margin-left: 15px;
                margin-right: 15px;
                margin-top: 10px;

            }
            .SESION .Carrito{
                margin-left: 30px;
            }

            .PP{
                height: 100vh;
                width: 100%;

                display: flex;
                align-items: center;
            }

            /* Centrar imagen del producto al lado izq de la secicón */
            .imgPP{
                height: 650px;
                width: 50%;

                display: flex;
                justify-content: center;
                align-items: center;
            }
            /* Borde de la imagen del producto (no se modificó el tamaño de la imagen pero de ser necesario se hará en ésta misma sección) */
            .imgPP img{
                height: 100%;
                width: 550px;
                border: 5px solid black;
            }



            .infosPP{
                height: 100%;
                width: 50%;


                display: flex;
                justify-content: center;
            }

            /* Centrar el texto, sin centrar el contenido */
            .TextoPP{
                height: 100%;
                width: 50%;

                display: flex;
                flex-direction: column;

                justify-content: center;
            }
            hr {
                border: none;                    /* elimina el estilo por defecto */
                height: 2px;                     /* grosor de la línea */
                background-color: black;       /* color de la línea */
                margin-top: 8px;                   /* espacio arriba y abajo */
                margin-bottom: 0px;
            }


            /* Caracteristicas a cada parte del texto */
            .TituloPP{
                font-family: abadi-mt;
                font-size: 20px;
                margin-bottom: 10px;
            }
            .ValorPP, .ImpuestosPP, .InfoPP, .botonPP{
                font-family: Arial;
                margin-top: 5px;
                font-size: large;
            }
            .DefPP, .PenaPP, .InfoExtraPP{
                font-family: Arial;
                letter-spacing: 1px;

            }
            .botonPP{
                margin-top: 20px;
                margin-bottom: 20px;

            }
            /* Características del botón "AGREGAR AL CARRITO" */
            .botonPP a{
                display: flex;
                justify-content: center;

                padding: 2%;
                border-radius: 10px;
                background-color: black;

                text-decoration: none;
                color: white;
                letter-spacing: 1.5px;
            }
            /* hr's y felchitas para desplegar info */
            .DefPP, .PenaPP, .InfoExtraPP{
                display: flex;
                justify-content: space-between;
            }

            .link333{
                margin-left: 10px;
                color: black;
                text-decoration: none;
            }

            .link333:hover{
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="MARCA">
                <p><a href="index.html"><b>MERCURY</b></a></p>
            </div>


            <div class="LINKS">
                <a href="Brincolines.html" class="a1"><b>BRINCOLINES</b></a>
                <a href="Inflables.html" class="a2"><b>INFLABLES</b></a>
                <a href="Futbolitos.html" class="a3"><b>FUTBOLITOS</b></a>
                <a href="Rockolas.html" class="a4"><b>ROCKOLA</b></a>
            </div>

            <div class="SESION">
                <a href="pedidos.html" class="Carrito">Ordenar</a>
                <a href="verPedidosAdministrador.html">Ver pedidos (Administrador)</a>
                <a href="registros.html" class="Inicio">Registrarse</a>
            </div>
        </header>

        <section class="PP">
            <div class="imgPP">
                <div class="carousel-slide"><img src="img/rockola1.jpeg" alt="Rockola"></div>
            </div>
            <div class="infosPP">
                <div class="TextoPP">
                    <div class="TituloPP">
                        <h2>Rockola</h2>
                    </div>
                    <div class="ValorPP">
                        $800 MXN
                    </div>
                    <hr>
                    <div class="ImpuestosPP">
                        Envio gratuito <br><br>
                        (IMPORTATE: UNICAMENTE A LOS ALREDEDORES DE IZTAPALAPA)
                    </div>
                    <hr>
                    <div class="InfoPP">
                        Dimensiones:<br>
                        40 Ancho (centimetros)
                        <br>
                        1 Largo (metros)
                        <br>
                        2 Altura (metros)
                    </div>
                    <div class="botonPP">
                        <a href="index.html"><b>Volver</b></a>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
